<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>PeakTrail | Trekking Management System</title>

    <!-- Google Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />

    <!-- Custom CSS -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/admin.css') }}"
    />

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/staff.css') }}"
    />

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/user.css') }}"
    />
  </head>

  <body>
    <div id="customAlert" class="custom-alert d-none">
      <div class="custom-alert-content">
        <div class="custom-alert-icon">
          <i class="bi bi-exclamation-triangle-fill"></i>
        </div>

        <h4 id="alertTitle">Error</h4>

        <p id="alertMessage"></p>

        <button class="btn btn-alert" onclick="closeCustomAlert()">OK</button>
      </div>
    </div>

    <div id="confirmModal" class="custom-alert d-none">
      <div class="custom-alert-content">
        <div class="custom-alert-icon confirm-icon">
          <i class="bi bi-question-circle-fill"></i>
        </div>

        <h4 id="confirmTitle">Confirmation</h4>

        <p id="confirmMessage"></p>

        <div class="confirm-buttons">
          <button class="btn btn-secondary" onclick="closeConfirmModal()">
            Cancel
          </button>

          <button class="btn btn-danger" id="confirmBtn">Confirm</button>
        </div>
      </div>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %} {% if
    messages %}

    <div class="toast-container-custom">
      {% for category, message in messages %}

      <div
        class="flash-toast flash-{{ category if category != 'message' else 'warning' }}"
      >
        <div class="flash-content">
          <span>{{ message }}</span>

          <button type="button" class="flash-close" onclick="closeToast(this)">
            ×
          </button>
        </div>

        <div class="flash-progress"></div>
      </div>

      {% endfor %}
    </div>

    {% endif %} {% endwith %} {% block content %}{% endblock %}

    <script>
      function showAlert(message, title = "Error") {
        document.getElementById("alertTitle").textContent = title;

        document.getElementById("alertMessage").textContent = message;

        document.getElementById("customAlert").classList.remove("d-none");
      }

      function closeCustomAlert() {
        document.getElementById("customAlert").classList.add("d-none");
      }
    </script>

    <script>
      let confirmAction = null;

      function showConfirm(message, callback) {
        document.getElementById("confirmMessage").textContent = message;

        document.getElementById("confirmModal").classList.remove("d-none");

        confirmAction = callback;
      }

      function closeConfirmModal() {
        document.getElementById("confirmModal").classList.add("d-none");

        confirmAction = null;
      }

      document.getElementById("confirmBtn").addEventListener(
        "click",

        function () {
          if (confirmAction) {
            confirmAction();
          }

          closeConfirmModal();
        },
      );
    </script>

    <script>
      function confirmForm(formId, message) {
        showConfirm(
          message,

          function () {
            document.getElementById(formId).submit();
          },
        );
      }
    </script>

    <script>
      function closeToast(button) {
        const toast = button.closest(".flash-toast");

        toast.classList.add("hide");

        setTimeout(() => {
          toast.remove();
        }, 300);
      }

      document.addEventListener("DOMContentLoaded", () => {
        const toasts = document.querySelectorAll(".flash-toast");

        toasts.forEach((toast, index) => {
          setTimeout(
            () => {
              toast.classList.add("hide");

              setTimeout(() => {
                toast.remove();
              }, 300);
            },
            6000 + index * 400,
          );
        });
      });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
