{% extends "admin/admin_base.html" %} {% block page_title %} Add Trek {%
endblock %} {% block page_description %} Create a new trekking event. {%
endblock %} {% block admin_content %}

<div class="dashboard-card">
  <form method="POST" action="{{ url_for('main.add_trek') }}">
    <div class="row g-4">
      <div class="col-md-6">
        <label class="form-label"> Trek Name </label>

        <input type="text" class="form-control" name="trek_name" minlength="3" maxlength="100" required />
      </div>

      <div class="col-md-6">
        <label class="form-label"> Location </label>

        <input type="text" class="form-control" name="location" minlength="3" maxlength="100" required />
      </div>

      <div class="col-md-4">
        <label class="form-label"> Difficulty </label>

        <select class="form-select" name="difficulty">
          <option>Easy</option>
          <option>Moderate</option>
          <option>Difficult</option>
        </select>
      </div>

      <div class="col-md-8">
        <label class="form-label"> Available Slots </label>

        <input
          type="number"
          class="form-control"
          name="available_slots"
          min="1"
          required
        />
      </div>

      <div class="col-md-6">
        <label class="form-label"> Start Date </label>

        <input
          type="date"
          id="start-date"
          class="form-control"
          name="start_date"
          required
        />
      </div>

      <div class="col-md-6">
        <label class="form-label"> End Date </label>

        <input type="date" id="end-date" class="form-control" name="end_date" required />
      </div>

      <div class="col-md-6">
        <label class="form-label"> Status </label>

        <select class="form-select" name="status">
          <option>Bookings Open</option>
          <option>Trek Ongoing</option>
          <option>Completed</option>
        </select>
      </div>

      <div class="col-md-6 mb-3">
        <label class="form-label">Price (₹)</label>

        <input
          type="number"
          step="0.01"
          min="0"
          name="price"
          class="form-control"
          required
        />
      </div>

      <div class="col-12 mb-3">
        <label class="form-label">Description</label>

        <textarea
          name="description"
          rows="4"
          class="form-control"
          minlength="10"
          maxlength="1000"
          required
        ></textarea>
      </div>

      <div class="col-md-6">
        <label class="form-label"> Assign Trek Staff </label>

        <div class="staff-box" id="staff-box">
          <p class="text-muted">Select a start date to load staff.</p>
        </div>

        <small class="text-muted">
          Select between 1 and 5 staff members.
        </small>
      </div>
    </div>

    <div class="mt-4">
      <button type="submit" class="btn btn-admin">
        <i class="bi bi-check-circle"></i>

        Create Trek
      </button>

      <a
        href="{{ url_for('main.manage_treks') }}"
        class="m-3 btn btn-outline-admin"
      >
        Cancel
      </a>
    </div>
  </form>
</div>

<script>
  document.addEventListener("DOMContentLoaded", function () {

    const startDateInput = document.getElementById("start-date");
    const endDateInput = document.getElementById("end-date");
    const staffBox = document.getElementById("staff-box");
    const form = document.querySelector("form");

    form.addEventListener("submit", function (e) {

        const start = new Date(startDateInput.value);

        const end = new Date(endDateInput.value);

        if (end < start) {

            e.preventDefault();

            showAlert(
                "End date cannot be before start date."
            );

        }

    });

    function loadStaff() {

      const startDate = startDateInput.value;
      const endDate = endDateInput.value;

      if (!startDate || !endDate) {
        return;
      }

      fetch(
        `/admin/available-staff?start_date=${startDate}&end_date=${endDate}`
      )
        .then(response => response.json())
        .then(data => {

          staffBox.innerHTML = "";

          if (data.length === 0) {

            staffBox.innerHTML =
              '<p class="text-danger">No staff available.</p>';

            return;
          }

          data.forEach(staff => {

            staffBox.innerHTML += `
              <label class="staff-item">
                <input
                  type="checkbox"
                  name="assigned_staff"
                  value="${staff.id}"
                >

                <span>${staff.name}</span>
              </label>
            `;

          });

        })
        .catch(error => {

          console.error(error);

          staffBox.innerHTML =
            '<p class="text-danger">Error loading staff.</p>';

        });
    }

    startDateInput.addEventListener("change", loadStaff);
    endDateInput.addEventListener("change", loadStaff);

  });
</script>

{% endblock %}
